name: Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list changes without applying them"
        type: boolean
        default: true
      clean_slate:
        description: "Wipe public_html before uploading (first deploy only)"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Working directory: $(pwd)"
          echo "Resolved local-dir: $(realpath ./dist/)"
          echo "--- files in dist/ ---"
          find dist -type f | sort
          echo "--- total: $(find dist -type f | wc -l) files ---"

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: public_html/
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: ${{ inputs.clean_slate }}
          log-level: standard
